<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Viewer desktop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;font-family:Quicksand,system-ui,sans-serif}
.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.btn{width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:#c3c6cf;display:grid;place-items:center;font:inherit;cursor:pointer}
.btn.on{background:#004488;color:#d5e3ff}
.tip{position:absolute;bottom:64px;left:50%;transform:translateX(-50%);background:#e2e2e6;color:#111318;font-size:12px;line-height:16px;font-weight:500;padding:4px 8px;border-radius:4px;white-space:nowrap}
.row{display:flex;align-items:center;gap:16px;height:56px;padding:0 16px;border-radius:28px;color:#e2e2e6;font-size:16px}
.row svg{color:#c3c6cf}
</style>
</helmet>
<div style="position:relative;width:1440px;height:900px;overflow:hidden;background:linear-gradient(160deg,#2c5d3a 0%,#3e7a46 30%,#274f79 62%,#1b3d63 100%)">
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse at 62% 48%,#8d7a63 0,#6e8a58 18%,transparent 40%),radial-gradient(ellipse at 80% 20%,#2c6b3a 0,transparent 35%)"></div>
  <div style="position:absolute;right:24px;bottom:100px;color:#ffffffcc;font-size:12px">Map area (terrain placeholder)</div>

  <!-- side sheet: 64px header, 48px back, title-large left aligned, close at right -->
  <div style="position:absolute;top:12px;left:12px;width:360px;height:876px;background:#191c20;border-radius:28px;box-shadow:0 1px 3px #0008,0 4px 8px 3px #0004;display:flex;flex-direction:column;overflow:hidden">
    <div style="height:64px;display:flex;align-items:center;gap:8px;padding:0 8px 0 8px;border-bottom:1px solid #43474e">
      <button class="btn" aria-label="Close menu"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div style="flex:1;font-size:22px;line-height:28px;color:#e2e2e6">Menu</div>
    </div>
    <div style="padding:8px;display:flex;flex-direction:column;gap:2px;overflow:auto">
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l6 2 5-2v14l-5 2-6-2-5 2V6z"/></svg><span style="flex:1">Maps</span><span style="color:#c3c6cf;font-size:13px">world</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.5 7-11a7 7 0 10-14 0c0 4.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg><span style="flex:1">Markers</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg><span style="flex:1">Settings</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.1"/></svg><span style="flex:1">Info</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20l4-1 11-11-3-3L5 16z"/></svg><span style="flex:1">Shared annotations</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4l9 5-9 5-9-5z"/><path d="M3 14l9 5 9-5"/></svg><span style="flex:1">Custom layers</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg></div>

      <div style="margin:12px 16px 4px;font-size:12px;line-height:16px;font-weight:500;letter-spacing:.5px;color:#c3c6cf;text-transform:uppercase">View</div>
      <!-- segmented buttons replace the loose icon row; every segment has a label -->
      <div style="margin:0 16px;display:flex;height:48px;border:1px solid #8d9199;border-radius:24px;overflow:hidden">
        <div style="flex:1;display:grid;place-items:center;font-size:14px;font-weight:500;background:#004488;color:#d5e3ff">Perspective</div>
        <div style="flex:1;display:grid;place-items:center;font-size:14px;font-weight:500;color:#e2e2e6;border-left:1px solid #8d9199">Flat</div>
        <div style="flex:1;display:grid;place-items:center;font-size:14px;font-weight:500;color:#e2e2e6;border-left:1px solid #8d9199">Free</div>
      </div>
      <div style="margin:8px 16px 0;display:flex;height:48px;border:1px solid #8d9199;border-radius:24px;overflow:hidden">
        <div style="flex:1;display:grid;place-items:center;font-size:14px;font-weight:500;background:#004488;color:#d5e3ff">Day</div>
        <div style="flex:1;display:grid;place-items:center;font-size:14px;font-weight:500;color:#e2e2e6;border-left:1px solid #8d9199">Night</div>
      </div>
      <div style="height:1px;background:#43474e;margin:16px 0 8px"></div>
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Go Fullscreen</div>
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/></svg>Reset Camera</div>
      <div class="row"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.5"/></svg>Take Screenshot</div>
      <div class="row" style="height:64px"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 10-3 6.2M20 4v5h-5"/></svg><span>Update Map<br><span style="font-size:12px;line-height:16px;color:#c3c6cf">Clear tile cache</span></span></div>
    </div>
  </div>

  <!-- top right: compass and zoom -->
  <div style="position:absolute;top:16px;right:16px;width:48px;height:48px;border-radius:24px;background:#1d2024;box-shadow:0 1px 3px #0008;display:grid;place-items:center;color:#e2e2e6"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l4 9h-8z"/><path d="M12 21l-4-9h8z" style="opacity:.45"/></svg></div>
  <div style="position:absolute;top:76px;right:16px;width:56px;background:#1d2024;box-shadow:0 1px 3px #0008;border-radius:16px;padding:4px;display:flex;flex-direction:column;gap:4px;margin-right:-4px">
    <button class="btn" aria-label="Zoom in" style="color:#e2e2e6"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button class="btn" aria-label="Zoom out" style="color:#e2e2e6"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14"/></svg></button>
  </div>

  <!-- coordinates card -->
  <div style="position:absolute;left:396px;bottom:16px;height:56px;padding:0 20px;background:#1d2024;border-radius:16px;box-shadow:0 1px 3px #0008;display:flex;align-items:center;gap:20px;color:#e2e2e6">
    <div><div style="font-size:11px;line-height:12px;color:#c3c6cf;letter-spacing:.5px">X</div><div style="font-size:16px;line-height:22px;font-variant-numeric:tabular-nums">-2</div></div>
    <div style="width:1px;height:28px;background:#43474e"></div>
    <div><div style="font-size:11px;line-height:12px;color:#c3c6cf;letter-spacing:.5px">Z</div><div style="font-size:16px;line-height:22px;font-variant-numeric:tabular-nums">-50</div></div>
  </div>

  <!-- map chip (top, right of the sheet; here shown beside where the menu button sits when closed) -->
  <div style="position:absolute;left:396px;top:16px;height:48px;padding:0 8px 0 16px;background:#1d2024;border-radius:24px;box-shadow:0 1px 3px #0008;display:flex;align-items:center;gap:10px;color:#e2e2e6;font-size:15px">
    <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l6 2 5-2v14l-5 2-6-2-5 2V6z"/></svg><span>world</span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
  </div>

  <!-- dock -->
  <div style="position:absolute;left:50%;bottom:16px;transform:translateX(-50%);margin-left:190px;height:56px;padding:4px 8px;background:#1d2024;border-radius:28px;box-shadow:0 2px 6px #0009;display:flex;align-items:center;gap:4px">
    <button class="btn" aria-label="Markers"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s7-6.5 7-11a7 7 0 10-14 0c0 4.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg></button>
    <button class="btn" aria-label="Players"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="9" r="3"/><path d="M3 20c0-4 3-6 6-6s6 2 6 6M16 6a3 3 0 010 6M18 14c2 1 3 3 3 6"/></svg></button>
    <div style="width:1px;height:24px;background:#43474e;margin:0 6px"></div>
    <button class="btn" aria-label="Night"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 019.5 4 8 8 0 1020 14.5z"/></svg></button>
    <div style="position:relative"><button class="btn on" aria-label="Flat view" aria-pressed="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="2"/></svg></button><div class="tip">Flat view</div></div>
    <button class="btn" aria-label="Reset camera"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2"/></svg></button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
