<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BlueMap viewer</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[data-wl-theme="dark"]{--wl-bg:#0B0E11;--wl-surface:#101418;--wl-surf-low:#191C20;--wl-surf-cont:#1D2024;--wl-surf-high:#272A2E;--wl-surf-highest:#323539;--wl-outline-var:#42474E;--wl-outline:#8C9199;--wl-on-surf-var:#C2C7CF;--wl-on-surf:#E1E2E8;--wl-primary:#8FCDFF;--wl-on-primary:#003351;--wl-prim-cont:#004B73;--wl-on-prim-cont:#CEE5FF;--wl-sec-cont:#384956;--wl-on-sec-cont:#D3E5F5;--wl-tert:#D1BFE7;--wl-tert-cont:#4E4161;--wl-on-tert-cont:#EDDCFF;--wl-error:#FFB4AB;--wl-scrim:rgba(0,0,0,.5)}
[data-wl-theme="light"]{--wl-bg:#F7F9FF;--wl-surface:#FFFFFF;--wl-surf-low:#F1F4FA;--wl-surf-cont:#EBEEF4;--wl-surf-high:#E5E8EE;--wl-surf-highest:#DFE2E8;--wl-outline-var:#C1C7CE;--wl-outline:#6C737A;--wl-on-surf-var:#41474D;--wl-on-surf:#181C20;--wl-primary:#00639B;--wl-on-primary:#FFFFFF;--wl-prim-cont:#CDE5FF;--wl-on-prim-cont:#001D32;--wl-sec-cont:#D3E5F5;--wl-on-sec-cont:#0C1D29;--wl-tert:#66587B;--wl-tert-cont:#EDDCFF;--wl-on-tert-cont:#211634;--wl-error:#BA1A1A;--wl-scrim:rgba(0,0,0,.32)}
[data-wl-theme="contrast"]{--wl-bg:#000000;--wl-surface:#000000;--wl-surf-low:#000000;--wl-surf-cont:#000000;--wl-surf-high:#141414;--wl-surf-highest:#1F1F1F;--wl-outline-var:#FFFFFF;--wl-outline:#FFFFFF;--wl-on-surf-var:#FFFFFF;--wl-on-surf:#FFFFFF;--wl-primary:#FFFFFF;--wl-on-primary:#000000;--wl-prim-cont:#FFFFFF;--wl-on-prim-cont:#000000;--wl-sec-cont:#000000;--wl-on-sec-cont:#FFFF00;--wl-tert:#FFFF00;--wl-tert-cont:#000000;--wl-on-tert-cont:#FFFF00;--wl-error:#FF5449;--wl-scrim:rgba(0,0,0,.85)}
[data-wl-theme="contrast"] .card{outline:1px solid #FFFFFF}
.msr{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
.fill{font-variation-settings:"FILL" 1}
.sl{position:relative;overflow:hidden;cursor:pointer}
.sl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity 150ms cubic-bezier(.2,0,0,1);pointer-events:none}
.sl:hover::after{opacity:.08}.sl:active::after{opacity:.10}
.sl:focus-visible{outline:3px solid var(--wl-primary);outline-offset:2px}
.ib{width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--wl-on-surf-var);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.seg{height:40px;border:1px solid var(--wl-outline);background:transparent;color:var(--wl-on-surf);font:500 14px/20px Roboto,sans-serif;padding:0 14px;display:inline-flex;align-items:center;gap:6px}
.seg[aria-pressed="true"]{background:var(--wl-sec-cont);color:var(--wl-on-sec-cont)}
.coord{display:flex;flex-direction:column;gap:2px}
.coord label{font:500 11px/14px Roboto,sans-serif;letter-spacing:.5px;color:var(--wl-on-surf-var)}
.coord input{width:84px;height:36px;box-sizing:border-box;padding:0 10px;border:1px solid var(--wl-outline);border-radius:8px;background:transparent;color:var(--wl-on-surf);font:500 14px/20px "Roboto Mono",monospace}
.coord input:focus{outline:2px solid var(--wl-primary);outline-offset:0;border-color:transparent}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</helmet>
<div data-wl-theme="{{theme}}" style="min-height: 900px; position: relative; overflow: hidden; background: var(--wl-bg); color: var(--wl-on-surf); font-family: Roboto, Helvetica, sans-serif;">
  <img src="/_blob/04f6b21208c7d88aaaa0bc6d4efe1bda" alt="The Heapandyville overworld rendered in 3D" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">
  <sc-if value="{{isNight}}" hint-placeholder-val="{{false}}">
    <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(4, 10, 30, .55);"></div>
  </sc-if>

  <div style="position: absolute; left: 16px; top: 16px; right: 16px; display: flex; gap: 12px; align-items: flex-start; flex-wrap: wrap;">
    <a href="Menu.dc.html" class="sl card" aria-label="Open the menu" style="width: 56px; height: 56px; border-radius: 16px; background: var(--wl-surf-cont); color: var(--wl-on-surf); display: flex; align-items: center; justify-content: center; text-decoration: none; box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);"><span class="msr" aria-hidden="true">menu</span></a>
    <button type="button" class="sl card" aria-label="Switch map, now Heapandyville overworld" style="display: flex; align-items: center; gap: 12px; height: 56px; padding: 0 16px 0 20px; border: 0; border-radius: 28px; background: var(--wl-surf-cont); color: var(--wl-on-surf); box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15); text-align: left;">
      <span style="display: flex; flex-direction: column;"><span style="font: 500 16px/22px Roboto, sans-serif;">Heapandyville</span><span style="font: 400 12px/16px Roboto, sans-serif; color: var(--wl-on-surf-var);">overworld</span></span>
      <span class="msr" aria-hidden="true" style="color: var(--wl-on-surf-var);">expand_more</span>
    </button>
    <div style="flex: 1;"></div>
    <div style="display: flex; flex-direction: column; gap: 12px; align-items: flex-end;">
      <button type="button" class="sl card" aria-label="Compass: facing north-west, press to face north" style="width: 56px; height: 56px; border: 0; border-radius: 28px; background: var(--wl-surf-cont); color: var(--wl-on-surf); display: flex; align-items: center; justify-content: center; box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);">
        <svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true" style="transform: rotate(-35deg);"><path d="M14 3 L19 14 L14 12 L9 14 Z" fill="var(--wl-error)"></path><path d="M14 25 L9 14 L14 16 L19 14 Z" fill="var(--wl-on-surf-var)"></path></svg>
      </button>
      <div class="card" role="group" aria-label="Zoom" style="display: flex; flex-direction: column; border-radius: 24px; background: var(--wl-surf-cont); box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15); overflow: hidden;">
        <button type="button" class="sl ib" aria-label="Zoom in"><span class="msr" aria-hidden="true">add</span></button>
        <div style="height: 1px; background: var(--wl-outline-var); margin: 0 8px;"></div>
        <button type="button" class="sl ib" aria-label="Zoom out"><span class="msr" aria-hidden="true">remove</span></button>
      </div>
    </div>
  </div>

  <div style="position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: 12px; align-items: flex-end; flex-wrap: wrap;">
    <form class="card" aria-label="Camera position" style="display: flex; align-items: flex-end; gap: 8px; padding: 10px 12px 12px; border-radius: 16px; background: var(--wl-surf-cont); box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15);">
      <div class="coord"><label for="px">X</label><input id="px" type="number" value="1204"></div>
      <div class="coord"><label for="pz">Z</label><input id="pz" type="number" value="-388"></div>
      <button type="button" class="sl ib" aria-label="Copy a link to this view" style="width: 40px; height: 40px;"><span class="msr" aria-hidden="true" style="font-size: 20px;">link</span></button>
    </form>
    <div style="flex: 1;"></div>
    <div role="toolbar" aria-label="Map controls" class="card" style="display: flex; align-items: center; gap: 4px; padding: 8px; border-radius: 28px; background: var(--wl-surf-cont); box-shadow: 0 4px 8px 3px rgba(0,0,0,.15), 0 1px 3px rgba(0,0,0,.3); flex-wrap: wrap; justify-content: center;">
      <a href="Menu.dc.html" class="sl ib" aria-label="Maps"><span class="msr" aria-hidden="true">map</span></a>
      <a href="Phone.dc.html" class="sl ib" aria-label="Markers"><span class="msr" aria-hidden="true">location_on</span></a>
      <button type="button" class="sl ib" aria-label="Players online"><span class="msr" aria-hidden="true">group</span></button>
      <span style="width: 1px; height: 24px; background: var(--wl-outline-var); margin: 0 6px;" aria-hidden="true"></span>
      <button type="button" class="sl ib" aria-label="{{dayLabel}}" aria-pressed="{{nightPressed}}" onClick="{{toggleNight}}" style="background: {{nightBg}}; color: {{nightFg}};"><span class="msr fill" aria-hidden="true">{{dayIcon}}</span></button>
      <div role="group" aria-label="View" style="display: flex; margin: 0 4px;">
        <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
          <button type="button" class="sl seg" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}" style="border-radius: {{v.radius}};"><span class="msr" aria-hidden="true" style="font-size: 18px;">{{v.icon}}</span>{{v.label}}</button>
        </sc-for>
      </div>
      <button type="button" class="sl ib" aria-label="Reset the camera"><span class="msr" aria-hidden="true">center_focus_strong</span></button>
    </div>
    <div style="flex: 1;"></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","contrast"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { view: 'Perspective', night: false };
  }
  renderVals() {
    const s = this.state;
    const defs = [
      { label: 'Perspective', icon: 'view_in_ar' },
      { label: 'Flat', icon: 'grid_on' },
      { label: 'Free flight', icon: 'flight' }
    ];
    const views = defs.map((d, i) => ({
      ...d,
      pressed: s.view === d.label ? 'true' : 'false',
      radius: i === 0 ? '20px 0 0 20px' : (i === defs.length - 1 ? '0 20px 20px 0' : '0'),
      pick: () => this.setState({ view: d.label })
    }));
    return {
      theme: this.props.theme ?? 'dark',
      views,
      isNight: s.night,
      dayIcon: s.night ? 'dark_mode' : 'light_mode',
      dayLabel: s.night ? 'Night lighting, press for day' : 'Day lighting, press for night',
      nightPressed: s.night ? 'true' : 'false',
      nightBg: s.night ? 'var(--wl-sec-cont)' : 'transparent',
      nightFg: s.night ? 'var(--wl-on-sec-cont)' : 'var(--wl-on-surf-var)',
      toggleNight: () => this.setState({ night: !s.night })
    };
  }
}
</script>
</body>
</html>
