<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BlueMap settings sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[data-wl-theme="dark"]{--wl-bg:#0B0E11;--wl-surface:#101418;--wl-surf-low:#191C20;--wl-surf-cont:#1D2024;--wl-surf-high:#272A2E;--wl-surf-highest:#323539;--wl-outline-var:#42474E;--wl-outline:#8C9199;--wl-on-surf-var:#C2C7CF;--wl-on-surf:#E1E2E8;--wl-primary:#8FCDFF;--wl-on-primary:#003351;--wl-prim-cont:#004B73;--wl-on-prim-cont:#CEE5FF;--wl-sec-cont:#384956;--wl-on-sec-cont:#D3E5F5;--wl-error:#FFB4AB}
[data-wl-theme="light"]{--wl-bg:#F7F9FF;--wl-surface:#FFFFFF;--wl-surf-low:#F1F4FA;--wl-surf-cont:#EBEEF4;--wl-surf-high:#E5E8EE;--wl-surf-highest:#DFE2E8;--wl-outline-var:#C1C7CE;--wl-outline:#6C737A;--wl-on-surf-var:#41474D;--wl-on-surf:#181C20;--wl-primary:#00639B;--wl-on-primary:#FFFFFF;--wl-prim-cont:#CDE5FF;--wl-on-prim-cont:#001D32;--wl-sec-cont:#D3E5F5;--wl-on-sec-cont:#0C1D29;--wl-error:#BA1A1A}
[data-wl-theme="contrast"]{--wl-bg:#000000;--wl-surface:#000000;--wl-surf-low:#000000;--wl-surf-cont:#000000;--wl-surf-high:#141414;--wl-surf-highest:#1F1F1F;--wl-outline-var:#FFFFFF;--wl-outline:#FFFFFF;--wl-on-surf-var:#FFFFFF;--wl-on-surf:#FFFFFF;--wl-primary:#FFFFFF;--wl-on-primary:#000000;--wl-prim-cont:#FFFFFF;--wl-on-prim-cont:#000000;--wl-sec-cont:#000000;--wl-on-sec-cont:#FFFF00;--wl-error:#FF5449}
[data-wl-theme="contrast"] .card{outline:1px solid #FFFFFF}
.msr{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
.sl{position:relative;overflow:hidden;cursor:pointer}
.sl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity 150ms cubic-bezier(.2,0,0,1);pointer-events:none}
.sl:hover::after{opacity:.08}.sl:active::after{opacity:.10}
.sl:focus-visible,.sw:focus-visible{outline:3px solid var(--wl-primary);outline-offset:2px}
.ib{width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--wl-on-surf-var);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.grp{border-radius:20px;background:var(--wl-surf-cont);padding:4px 0}
.gh{margin:20px 16px 8px;font:500 14px/20px Roboto,sans-serif;color:var(--wl-primary)}
.row{display:flex;align-items:center;gap:16px;min-height:56px;padding:8px 16px;box-sizing:border-box}
.rl{flex:1;min-width:0;display:flex;flex-direction:column;font:400 16px/24px Roboto,sans-serif}
.rs{font:400 13px/18px Roboto,sans-serif;color:var(--wl-on-surf-var)}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--wl-outline);background:var(--wl-surf-highest);position:relative;padding:0;flex:0 0 52px;cursor:pointer;box-sizing:border-box}
.sw::before{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--wl-outline);transition:all 200ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--wl-primary);border-color:var(--wl-primary)}
.sw[aria-checked="true"]::before{left:22px;top:2px;width:24px;height:24px;background:var(--wl-on-primary)}
.seg{flex:1;height:40px;border:1px solid var(--wl-outline);background:transparent;color:var(--wl-on-surf);font:500 14px/20px Roboto,sans-serif;padding:0 8px;margin-left:-1px}
.seg:first-child{border-radius:20px 0 0 20px;margin-left:0}.seg:last-child{border-radius:0 20px 20px 0}
.seg[aria-pressed="true"]{background:var(--wl-sec-cont);color:var(--wl-on-sec-cont)}
.sld{display:flex;flex-direction:column;gap:4px;padding:8px 16px}
.sld label{display:flex;justify-content:space-between;font:400 16px/24px Roboto,sans-serif}
.sld output{font:500 14px/24px "Roboto Mono",monospace;color:var(--wl-on-surf-var)}
input[type=range]{accent-color:var(--wl-primary);width:100%;height:24px;margin:0}
.dv{height:1px;background:var(--wl-outline-var);margin:0 16px}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</helmet>
<div data-wl-theme="{{theme}}" style="min-height: 900px; position: relative; overflow: hidden; background: var(--wl-bg); color: var(--wl-on-surf); font-family: Roboto, Helvetica, sans-serif; display: flex;">
  <img src="/_blob/04f6b21208c7d88aaaa0bc6d4efe1bda" alt="The Heapandyville overworld rendered in 3D" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">

  <section aria-labelledby="set-title" class="card" style="position: relative; margin: 12px; width: 420px; max-width: calc(100% - 24px); max-height: 876px; box-sizing: border-box; padding: 12px 12px 16px; border-radius: 28px; background: var(--wl-surf-low); box-shadow: 0 1px 2px rgba(0,0,0,.3), 0 2px 6px 2px rgba(0,0,0,.15); display: flex; flex-direction: column; overflow: hidden;">
    <div style="display: flex; align-items: center; gap: 4px; padding: 0 0 8px;">
      <a href="Menu.dc.html" class="sl ib" aria-label="Back to the menu"><span class="msr" aria-hidden="true">arrow_back</span></a>
      <h1 id="set-title" style="flex: 1; margin: 0; font-size: 22px; line-height: 28px; font-weight: 400;">Settings</h1>
      <a href="Main.dc.html" class="sl ib" aria-label="Close the menu"><span class="msr" aria-hidden="true">close</span></a>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 56px; padding: 0 4px 0 16px; border-radius: 28px; background: var(--wl-surf-high); margin-bottom: 4px;">
      <span class="msr" aria-hidden="true" style="color: var(--wl-on-surf-var);">search</span>
      <input type="search" aria-label="Search settings" placeholder="Search settings" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--wl-on-surf); font: 400 16px/24px Roboto, sans-serif; outline: none;">
      <button type="button" class="sl ib" aria-label="Regex builder" style="width: 40px; height: 40px;"><span class="msr" aria-hidden="true" style="font-size: 20px;">regular_expression</span></button>
    </div>

    <div style="overflow-y: auto; padding: 0 2px 8px;">
      <h2 class="gh">View</h2>
      <div class="grp" style="padding: 12px 16px;">
        <div role="group" aria-label="Camera" style="display: flex;">
          <sc-for list="{{views}}" as="v" hint-placeholder-count="3">
            <button type="button" class="seg sl" aria-pressed="{{v.pressed}}" onClick="{{v.pick}}">{{v.label}}</button>
          </sc-for>
        </div>
      </div>

      <h2 class="gh">Lighting</h2>
      <div class="grp">
        <div class="sld"><label for="sun"><span>Sunlight</span><output>{{sunText}}</output></label><input id="sun" type="range" min="0" max="100" value="{{sun}}" onChange="{{setSun}}"></div>
        <div class="sld"><label for="amb"><span>Ambient light</span><output>{{ambText}}</output></label><input id="amb" type="range" min="0" max="100" value="{{amb}}" onChange="{{setAmb}}"></div>
      </div>

      <h2 class="gh">Resolution</h2>
      <div class="grp" style="padding: 12px 16px;">
        <div role="group" aria-label="Resolution" style="display: flex;">
          <sc-for list="{{qualities}}" as="q" hint-placeholder-count="3">
            <button type="button" class="seg sl" aria-pressed="{{q.pressed}}" onClick="{{q.pick}}">{{q.label}}</button>
          </sc-for>
        </div>
      </div>

      <h2 class="gh">Render distance</h2>
      <div class="grp">
        <div class="sld"><label for="hi"><span>High-resolution</span><output>{{hiText}}</output></label><input id="hi" type="range" min="50" max="500" step="10" value="{{hi}}" onChange="{{setHi}}"></div>
        <div class="sld"><label for="lo"><span>Low-resolution</span><output>{{loText}}</output></label><input id="lo" type="range" min="500" max="10000" step="100" value="{{lo}}" onChange="{{setLo}}"></div>
        <div class="dv"></div>
        <sc-for list="{{switchesA}}" as="w" hint-placeholder-count="2">
          <div class="row"><span class="rl"><span id="{{w.id}}">{{w.label}}</span><span class="rs">{{w.sub}}</span></span><button type="button" class="sw" role="switch" aria-checked="{{w.on}}" aria-labelledby="{{w.id}}" onClick="{{w.toggle}}"></button></div>
        </sc-for>
      </div>

      <h2 class="gh">Free flight</h2>
      <div class="grp">
        <div class="sld"><label for="ms"><span>Mouse sensitivity</span><output>{{msText}}</output></label><input id="ms" type="range" min="10" max="500" step="5" value="{{ms}}" onChange="{{setMs}}"></div>
        <sc-for list="{{switchesB}}" as="w" hint-placeholder-count="1">
          <div class="row"><span class="rl"><span id="{{w.id}}">{{w.label}}</span><span class="rs">{{w.sub}}</span></span><button type="button" class="sw" role="switch" aria-checked="{{w.on}}" aria-labelledby="{{w.id}}" onClick="{{w.toggle}}"></button></div>
        </sc-for>
      </div>

      <h2 class="gh">Appearance</h2>
      <div class="grp">
        <div style="padding: 12px 16px 4px;">
          <div role="group" aria-label="Theme" style="display: flex;">
            <sc-for list="{{themes}}" as="t" hint-placeholder-count="4">
              <button type="button" class="seg sl" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}">{{t.label}}</button>
            </sc-for>
          </div>
        </div>
        <div class="row"><label for="lang" class="rl">Language</label>
          <select id="lang" style="height: 40px; padding: 0 12px; border: 1px solid var(--wl-outline); border-radius: 8px; background: var(--wl-surf-low); color: var(--wl-on-surf); font: 400 14px/20px Roboto, sans-serif;"><option>English</option><option>Deutsch</option><option>Français</option><option>中文</option></select>
        </div>
      </div>

      <h2 class="gh">Screenshots and debugging</h2>
      <div class="grp">
        <sc-for list="{{switchesC}}" as="w" hint-placeholder-count="3">
          <div class="row"><span class="rl"><span id="{{w.id}}">{{w.label}}</span><span class="rs">{{w.sub}}</span></span><button type="button" class="sw" role="switch" aria-checked="{{w.on}}" aria-labelledby="{{w.id}}" onClick="{{w.toggle}}"></button></div>
        </sc-for>
      </div>

      <div style="padding: 20px 4px 4px;">
        <button type="button" class="sl" style="height: 40px; padding: 0 20px; border: 1px solid var(--wl-outline); border-radius: 20px; background: transparent; color: var(--wl-error); font: 500 14px/20px Roboto, sans-serif; display: inline-flex; align-items: center; gap: 8px;"><span class="msr" aria-hidden="true" style="font-size: 20px;">restart_alt</span>Reset all settings</button>
      </div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","contrast"],"default":"dark"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      view: 'Perspective', quality: 'Normal', theme: 'System',
      sun: 100, amb: 10, hi: 150, lo: 2000, ms: 100,
      on: { loading: true, zoom: true, invert: false, clipboard: true, chunks: false, debug: false }
    };
  }
  seg(list, key) {
    return list.map((label) => ({ label, pressed: this.state[key] === label ? 'true' : 'false', pick: () => this.setState({ [key]: label }) }));
  }
  sw(defs) {
    const s = this.state;
    return defs.map((d) => ({ ...d, id: 'sw-' + d.key, on: s.on[d.key] ? 'true' : 'false', toggle: () => this.setState({ on: { ...s.on, [d.key]: !s.on[d.key] } }) }));
  }
  renderVals() {
    const s = this.state;
    const num = (key) => (e) => this.setState({ [key]: Number(e.target.value) });
    return {
      theme: this.props.theme ?? 'dark',
      views: this.seg(['Perspective', 'Flat', 'Free flight'], 'view'),
      qualities: this.seg(['High', 'Normal', 'Low'], 'quality'),
      themes: this.seg(['System', 'Light', 'Dark', 'Contrast'], 'theme'),
      sun: s.sun, sunText: s.sun + '%', setSun: num('sun'),
      amb: s.amb, ambText: s.amb + '%', setAmb: num('amb'),
      hi: s.hi, hiText: s.hi + ' blocks', setHi: num('hi'),
      lo: s.lo, loText: s.lo + ' blocks', setLo: num('lo'),
      ms: s.ms, msText: (s.ms / 100).toFixed(2) + '×', setMs: num('ms'),
      switchesA: this.sw([
        { key: 'loading', label: 'Load new tiles', sub: 'Turn off to freeze what is loaded on a slow connection' },
        { key: 'zoom', label: 'Zoom buttons', sub: 'Show + and − beside the compass' }
      ]),
      switchesB: this.sw([{ key: 'invert', label: 'Invert vertical mouse', sub: 'Moving the mouse up looks down' }]),
      switchesC: this.sw([
        { key: 'clipboard', label: 'Copy screenshots to the clipboard', sub: 'Otherwise they download as a file' },
        { key: 'chunks', label: 'Chunk borders', sub: 'Draw a line on every 16-block boundary' },
        { key: 'debug', label: 'Debug information', sub: 'Frame time, tile counts and camera state' }
      ])
    };
  }
}
</script>
</body>
</html>
