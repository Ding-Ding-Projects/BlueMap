<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>BlueMap markers on a phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;family=Roboto+Mono:wght@400;500&amp;family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0..1,0&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[data-wl-theme="dark"]{--wl-bg:#0B0E11;--wl-surf-low:#191C20;--wl-surf-cont:#1D2024;--wl-surf-high:#272A2E;--wl-surf-highest:#323539;--wl-outline-var:#42474E;--wl-outline:#8C9199;--wl-on-surf-var:#C2C7CF;--wl-on-surf:#E1E2E8;--wl-primary:#8FCDFF;--wl-on-primary:#003351;--wl-sec-cont:#384956;--wl-on-sec-cont:#D3E5F5;--wl-tert-cont:#4E4161;--wl-on-tert-cont:#EDDCFF;--wl-scrim:rgba(0,0,0,.5)}
[data-wl-theme="light"]{--wl-bg:#F7F9FF;--wl-surf-low:#F1F4FA;--wl-surf-cont:#EBEEF4;--wl-surf-high:#E5E8EE;--wl-surf-highest:#DFE2E8;--wl-outline-var:#C1C7CE;--wl-outline:#6C737A;--wl-on-surf-var:#41474D;--wl-on-surf:#181C20;--wl-primary:#00639B;--wl-on-primary:#FFFFFF;--wl-sec-cont:#D3E5F5;--wl-on-sec-cont:#0C1D29;--wl-tert-cont:#EDDCFF;--wl-on-tert-cont:#211634;--wl-scrim:rgba(0,0,0,.32)}
[data-wl-theme="contrast"]{--wl-bg:#000000;--wl-surf-low:#000000;--wl-surf-cont:#000000;--wl-surf-high:#141414;--wl-surf-highest:#1F1F1F;--wl-outline-var:#FFFFFF;--wl-outline:#FFFFFF;--wl-on-surf-var:#FFFFFF;--wl-on-surf:#FFFFFF;--wl-primary:#FFFFFF;--wl-on-primary:#000000;--wl-sec-cont:#000000;--wl-on-sec-cont:#FFFF00;--wl-tert-cont:#000000;--wl-on-tert-cont:#FFFF00;--wl-scrim:rgba(0,0,0,.85)}
[data-wl-theme="contrast"] .card{outline:1px solid #FFFFFF}
.msr{font-family:"Material Symbols Rounded";font-weight:normal;font-style:normal;font-size:24px;line-height:1;display:inline-block;white-space:nowrap;font-feature-settings:"liga";-webkit-font-smoothing:antialiased}
.sl{position:relative;overflow:hidden;cursor:pointer}
.sl::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity 150ms cubic-bezier(.2,0,0,1);pointer-events:none}
.sl:hover::after{opacity:.08}.sl:active::after{opacity:.10}
.sl:focus-visible,.sw:focus-visible{outline:3px solid var(--wl-primary);outline-offset:2px}
.ib{width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--wl-on-surf-var);display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
.sw{width:52px;height:32px;border-radius:16px;border:2px solid var(--wl-outline);background:var(--wl-surf-highest);position:relative;padding:0;flex:0 0 52px;cursor:pointer;box-sizing:border-box}
.sw::before{content:"";position:absolute;top:6px;left:6px;width:16px;height:16px;border-radius:50%;background:var(--wl-outline);transition:all 200ms cubic-bezier(.2,0,0,1)}
.sw[aria-checked="true"]{background:var(--wl-primary);border-color:var(--wl-primary)}
.sw[aria-checked="true"]::before{left:22px;top:2px;width:24px;height:24px;background:var(--wl-on-primary)}
@media (prefers-reduced-motion: reduce){*,*::before,*::after{transition-duration:.001ms!important;animation-duration:.001ms!important}}
</style>
</helmet>
<div data-wl-theme="{{theme}}" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--wl-bg); color: var(--wl-on-surf); font-family: Roboto, Helvetica, sans-serif;">
  <img src="/_blob/04f6b21208c7d88aaaa0bc6d4efe1bda" alt="The Heapandyville overworld rendered in 3D" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover;">

  <div style="position: absolute; left: 12px; right: 12px; top: 12px; display: flex; gap: 8px; align-items: center;">
    <a href="Menu.dc.html" class="sl card" aria-label="Open the menu" style="width: 48px; height: 48px; border-radius: 16px; background: var(--wl-surf-cont); color: var(--wl-on-surf); display: flex; align-items: center; justify-content: center; text-decoration: none;"><span class="msr" aria-hidden="true">menu</span></a>
    <button type="button" class="sl card" aria-label="Switch map, now Heapandyville overworld" style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 48px; padding: 0 12px 0 16px; border: 0; border-radius: 24px; background: var(--wl-surf-cont); color: var(--wl-on-surf); text-align: left; font: 500 15px/20px Roboto, sans-serif;"><span style="flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Heapandyville · overworld</span><span class="msr" aria-hidden="true" style="color: var(--wl-on-surf-var);">expand_more</span></button>
    <button type="button" class="sl card" aria-label="Compass: facing north-west, press to face north" style="width: 48px; height: 48px; border: 0; border-radius: 24px; background: var(--wl-surf-cont); display: flex; align-items: center; justify-content: center;"><svg width="24" height="24" viewBox="0 0 28 28" aria-hidden="true" style="transform: rotate(-35deg);"><path d="M14 3 L19 14 L14 12 L9 14 Z" fill="#FFB4AB"></path><path d="M14 25 L9 14 L14 16 L19 14 Z" fill="var(--wl-on-surf-var)"></path></svg></button>
  </div>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: var(--wl-scrim);"></div>

  <section role="dialog" aria-modal="true" aria-labelledby="mk-title" class="card" style="position: absolute; left: 0; right: 0; bottom: 0; max-height: 600px; display: flex; flex-direction: column; border-radius: 28px 28px 0 0; background: var(--wl-surf-low); box-shadow: 0 -2px 6px 2px rgba(0,0,0,.15);">
    <div aria-hidden="true" style="width: 32px; height: 4px; border-radius: 2px; background: var(--wl-on-surf-var); opacity: .4; margin: 16px auto 8px;"></div>
    <div style="display: flex; align-items: center; gap: 4px; padding: 0 8px 0 24px;">
      <h1 id="mk-title" style="flex: 1; margin: 0; font-size: 22px; line-height: 28px; font-weight: 400;">Markers</h1>
      <a href="Main.dc.html" class="sl ib" aria-label="Close markers"><span class="msr" aria-hidden="true">close</span></a>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; height: 48px; margin: 8px 16px 8px; padding: 0 4px 0 14px; border-radius: 24px; background: var(--wl-surf-high);">
      <span class="msr" aria-hidden="true" style="color: var(--wl-on-surf-var); font-size: 20px;">search</span>
      <input type="search" aria-label="Search markers" placeholder="Search markers" style="flex: 1; min-width: 0; border: 0; background: transparent; color: var(--wl-on-surf); font: 400 16px/24px Roboto, sans-serif; outline: none;">
      <button type="button" class="sl ib" aria-label="Regex builder" style="width: 40px; height: 40px;"><span class="msr" aria-hidden="true" style="font-size: 20px;">regular_expression</span></button>
    </div>
    <div style="overflow-y: auto; padding: 0 12px 24px; display: flex; flex-direction: column; gap: 8px;">
      <sc-for list="{{sets}}" as="m" hint-placeholder-count="3">
        <div style="border-radius: 20px; background: var(--wl-surf-cont);">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 64px; padding: 8px 12px 8px 8px;">
            <button type="button" class="sl ib" aria-expanded="{{m.expanded}}" aria-label="{{m.expandLabel}}" onClick="{{m.expand}}"><span class="msr" aria-hidden="true">{{m.chevron}}</span></button>
            <span style="width: 40px; height: 40px; border-radius: 12px; background: var(--wl-tert-cont); color: var(--wl-on-tert-cont); display: flex; align-items: center; justify-content: center; flex: 0 0 40px;"><span class="msr" aria-hidden="true" style="font-size: 22px;">{{m.icon}}</span></span>
            <span id="{{m.id}}" style="flex: 1; min-width: 0; font: 500 16px/22px Roboto, sans-serif;">{{m.label}}</span>
            <button type="button" class="sw" role="switch" aria-checked="{{m.on}}" aria-labelledby="{{m.id}}" onClick="{{m.toggle}}"></button>
          </div>
          <sc-if value="{{m.isOpen}}" hint-placeholder-val="{{false}}">
            <div style="padding: 0 12px 12px 68px; display: flex; flex-direction: column; gap: 2px;">
              <sc-for list="{{m.items}}" as="it" hint-placeholder-count="2">
                <button type="button" class="sl" style="display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 0 12px; border: 0; border-radius: 16px; background: transparent; color: var(--wl-on-surf); text-align: left; font: 400 15px/20px Roboto, sans-serif;"><span style="flex: 1;">{{it}}</span><span class="msr" aria-hidden="true" style="font-size: 20px; color: var(--wl-primary);">my_location</span></button>
              </sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["dark","light","contrast"],"default":"dark"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: 'players', on: { players: true, poi: true, paths: false } };
  }
  renderVals() {
    const s = this.state;
    const defs = [
      { key: 'players', icon: 'group', label: 'Players', items: ['[player name]', '[player name]'] },
      { key: 'poi', icon: 'location_on', label: 'Points of interest', items: ['[marker name]', '[marker name]'] },
      { key: 'paths', icon: 'route', label: 'Paths and areas', items: ['[marker name]'] }
    ];
    const sets = defs.map((d) => ({
      ...d,
      id: 'set-' + d.key,
      on: s.on[d.key] ? 'true' : 'false',
      isOpen: s.open === d.key,
      expanded: s.open === d.key ? 'true' : 'false',
      chevron: s.open === d.key ? 'expand_less' : 'expand_more',
      expandLabel: (s.open === d.key ? 'Collapse ' : 'Expand ') + d.label,
      expand: () => this.setState({ open: s.open === d.key ? '' : d.key }),
      toggle: () => this.setState({ on: { ...s.on, [d.key]: !s.on[d.key] } })
    }));
    return { theme: this.props.theme ?? 'dark', sets };
  }
}
</script>
</body>
</html>
